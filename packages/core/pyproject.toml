[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concreteness-knn-core"
version = "0.2.0"
description = "Core concreteness prediction toolkit via kNN regression"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "fasttext",
  "gensim",
]

[project.scripts]
concreteness-knn-core = "concreteness_knn_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
