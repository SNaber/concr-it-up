# Install in /etc/nginx/conf.d/. These directives belong to Nginx's http block.
# Rate state is held in memory only; the minimal log omits client
# addresses, query strings, request bodies, and authenticated usernames.
limit_req_zone $binary_remote_addr zone=concritup_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=concritup_jobs:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=concritup_uploads:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=concritup_connections:10m;

log_format concritup_min '$time_iso8601 "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';
