# Temporary HTTP-only site used to obtain the first certificate with Certbot's
# webroot authenticator. Replace concr-it-up.example.org with the deployment's
# public hostname, then replace this file with concr-it-up-site.conf after
# certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name concr-it-up.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 503;
    }
}
