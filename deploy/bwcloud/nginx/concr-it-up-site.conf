# Replace concr-it-up.example.org with the deployment's public hostname in all
# server_name and certificate-path directives before enabling this template.
upstream concritup_web {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name concr-it-up.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name concr-it-up.example.org;

    ssl_certificate /etc/letsencrypt/live/concr-it-up.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concr-it-up.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:concritup_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/concr-it-up-access.conf;

    server_tokens off;
    # The application accepts at most 10 MiB per uploaded file; one additional
    # MiB leaves room for multipart framing without weakening the app limit.
    client_max_body_size 11m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 60s;
    limit_conn concritup_connections 20;
    limit_req_status 429;

    access_log /var/log/nginx/concr-it-up.access.log concritup_min;
    error_log /var/log/nginx/concr-it-up.error.log warn;

    # The GUI positions its help popover with element.style, so styles require
    # inline permission. Scripts remain restricted to same-origin files.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Nginx overwrites, rather than appends, this identity header. The Flask
    # service accepts it only in authenticated mode and is bound to loopback.
    proxy_set_header X-Remote-User $remote_user;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 75s;

    location = /api/jobs/prediction-run {
        limit_req zone=concritup_jobs burst=1 nodelay;
        proxy_pass http://concritup_web;
    }

    location = /api/jobs/prediction-holdout {
        limit_req zone=concritup_jobs burst=1 nodelay;
        proxy_pass http://concritup_web;
    }

    location = /api/fs/upload {
        limit_req zone=concritup_uploads burst=2 nodelay;
        proxy_pass http://concritup_web;
    }

    location /api/ {
        limit_req zone=concritup_api burst=30 nodelay;
        proxy_pass http://concritup_web;
    }

    location / {
        limit_req zone=concritup_api burst=30 nodelay;
        proxy_pass http://concritup_web;
    }
}
